name: Client

on:
  push:
    branches: [master]
    paths:
      - 'client/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/client.yml'
  pull_request:
    paths:
      - 'client/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/client.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint build test --filter=client
