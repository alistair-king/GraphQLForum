name: Server

on:
  push:
    branches: [master]
    paths: ['server/**', '.github/workflows/server.yml']
  pull_request:
    paths: ['server/**', '.github/workflows/server.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: graphqlforum_test
      DB_USER: graphqlforum
      DB_PASSWORD: graphqlforum
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: graphqlforum_test
          MYSQL_USER: graphqlforum
          MYSQL_PASSWORD: graphqlforum
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
